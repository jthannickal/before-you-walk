<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Before You Walk architecture</title><desc id="desc">A real local Strands agent uses bounded tools against a deterministic policy and fictional message transport. A separate browser sandbox shares the same policy and displays recorded agent evidence.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#087c8a" stroke-width="2"/></marker></defs>
<rect width="1400" height="900" fill="#f3f7fb"/><g font-family="Arial,sans-serif" fill="#122c43"><text x="70" y="80" font-size="38" font-weight="700">Before You Walk</text><text x="70" y="120" font-size="22">AI coordinates. Evidence determines availability.</text>
<rect x="70" y="180" width="350" height="150" rx="16" fill="#102f45"/><text x="95" y="225" fill="white" font-size="24" font-weight="700">Real Strands agent</text><text x="95" y="264" fill="#d0e0ec" font-size="19">Local Ollama model · five tools</text><text x="95" y="295" fill="#d0e0ec" font-size="19">Bounded turns, tokens, timeout</text>
<rect x="520" y="180" width="350" height="150" rx="16" fill="white" stroke="#b9ceda"/><text x="545" y="225" font-size="24" font-weight="700">Deterministic policy</text><text x="545" y="264" font-size="19">Freshness · conflicts · arrival</text><text x="545" y="295" font-size="19">Consent · deduplication · limits</text>
<rect x="970" y="180" width="350" height="150" rx="16" fill="white" stroke="#b9ceda"/><text x="995" y="225" font-size="24" font-weight="700">Simulated transport</text><text x="995" y="264" font-size="19">Opted-in fictional caretaker inbox</text><text x="995" y="295" font-size="19">No SMS or WhatsApp connection</text>
<path d="M425 255H510 M875 255H960" stroke="#087c8a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="520" y="430" width="350" height="145" rx="16" fill="#dcf2ef" stroke="#087c8a"/><text x="545" y="475" font-size="24" font-weight="700">Policy-generated answer</text><text x="545" y="513" font-size="19">Verified report or explicit unknown</text><text x="545" y="545" font-size="19">Model prose cannot override it</text><path d="M695 335V420" stroke="#087c8a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="430" width="350" height="145" rx="16" fill="white" stroke="#b9ceda"/><text x="95" y="475" font-size="24" font-weight="700">Browser policy sandbox</text><text x="95" y="513" font-size="19">Same engine · manual fixture replies</text><text x="95" y="545" font-size="19">No live browser inference</text><path d="M425 500H510" stroke="#087c8a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="970" y="430" width="350" height="145" rx="16" fill="white" stroke="#b9ceda"/><text x="995" y="475" font-size="24" font-weight="700">Auditable execution</text><text x="995" y="513" font-size="19">Tool inputs, results, timestamps</text><text x="995" y="545" font-size="19">Recorded real run shown in browser</text><path d="M875 500H960" stroke="#087c8a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="655" width="1250" height="155" rx="16" fill="#e5eef6"/><text x="95" y="696" font-size="21" font-weight="700">Trust boundaries and honest limits</text><text x="95" y="734" font-size="20">Reply text is untrusted. Source and clock come from the simulator. Unsupported replies remain unknown.</text><text x="95" y="774" font-size="20">All locations are fictional. No field pilot. Availability does not establish drinking-water safety.</text>
<text x="70" y="863" font-size="17">James Thannickal · AI-assisted prototype · September 2026 · Optional Bedrock configuration not live-tested</text></g></svg>
